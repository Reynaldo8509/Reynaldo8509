  <rect x="1068" y="404" width="270" height="140" rx="18" fill="url(#panel)" stroke="#d18bff" stroke-width="2"/>
  <rect x="1097" y="437" width="46" height="30" rx="4" fill="#26194c" stroke="#b987ff"/>
  <rect x="1150" y="437" width="46" height="30" rx="4" fill="#26194c" stroke="#b987ff"/>
